name: HoodPhone Build v022

on:
  push:
    branches:
      - hoodphone-build-v022
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoodphone_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Reconstruct source
        run: |
          cat src_00a.b64 src_00b.b64 src_01.b64 src_02.b64 src_03.b64 | base64 -d > source.zip
          unzip -t source.zip
          unzip -o source.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/java/pl/hoodstories/hoodphone/ModSounds.java")
          s = p.read_text()
          s = s.replace(
              "SoundEvent.createVariableRangeEvent(new ResourceLocation(HoodPhone.MODID, name))",
              "new SoundEvent(new ResourceLocation(HoodPhone.MODID, name))"
          )
          p.write_text(s)
          PY

      - name: Build real Forge reobfuscated jar
        run: gradle build --stacktrace --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hoodphone-v022
          path: hoodphone_build/build/libs/*.jar
          if-no-files-found: error
