buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

group = 'pl.hoodstories'
version = '0.2.2'
archivesBaseName = 'HoodPhone-iPhone18Pro-Forge1.19.2'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.19.2'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.2'
    implementation 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
            "Specification-Title": "hoodphone",
            "Specification-Vendor": "Hood Stories Chicago",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "Hood Stories Chicago"
        ])
    }
    finalizedBy 'reobfJar'
}
